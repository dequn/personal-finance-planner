prompt_cases:
  - id: prompt-requires-deterministic-classification-route
    input:
      session_context: ""
      profile_context: ""
      goal_context: ""
      requested_capability: auto
      jurisdiction: unspecified
    expected:
      contains:
        - route_financial_planning_stage
        - planning://workflow-registry/v0.2.0
        - Execute only one material stage
        - Do not persist state
        - https://www.cfp.net/
        - does not authorize
        - Do not append a fixed FI or home menu

  - id: prompt-preserves-routed-stage
    input:
      session_context: "next_stage=goal_clarification; next_skill=financial-goal-clarification"
      profile_context: "Profile facts are confirmed for the named scope."
      goal_context: "A major-purchase goal is proposed and optional."
      requested_capability: home_opportunity
      jurisdiction: China mainland
    expected:
      contains:
        - goal_clarification
        - home_opportunity
        - Execute only one material stage
        - do not recreate the specialist workflows
      excludes:
        - design_cash_liquidity_policy
