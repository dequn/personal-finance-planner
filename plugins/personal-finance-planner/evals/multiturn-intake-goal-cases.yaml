version: 0.1.0
fixture_classification: synthetic
suite_id: intake-goal-multiturn-p0.1
cases:
  - id: profile-progressive-three-turn
    workflow: profile_intake
    skill: financial-profile-intake
    proposal_schema: financial-profile-proposal.schema.json
    validator_tool: validate_financial_profile
    turns:
      - turn_id: profile-1
        user_message: >-
          Start a financial profile. These synthetic facts are supplied with
          stable keys: jurisdiction.tax_residency is mainland-china and is
          user_confirmed; income.annual_net is CNY 240000 and is a user_estimate;
          spending.annual_total is CNY 120000 and is a user_estimate.
        supplied_keys:
          - jurisdiction.tax_residency
          - income.annual_net
          - spending.annual_total
        expected_known_keys:
          - jurisdiction.tax_residency
          - income.annual_net
          - spending.annual_total
        final_turn: false
      - turn_id: profile-2
        user_message: >-
          Continue the same intake. income.net_range_3y is CNY 180000 to 300000
          and is a user_estimate; liabilities.status is none and is
          user_confirmed; spending.monthly_necessary is CNY 8000 and is a
          user_estimate.
        supplied_keys:
          - income.net_range_3y
          - liabilities.status
          - spending.monthly_necessary
        expected_known_keys:
          - jurisdiction.tax_residency
          - income.annual_net
          - spending.annual_total
          - income.net_range_3y
          - liabilities.status
          - spending.monthly_necessary
        final_turn: false
      - turn_id: profile-3
        user_message: >-
          Continue the same intake. liquidity.cash is CNY 60000 and is a
          user_estimate; assets.long_term is CNY 300000 and is a user_estimate;
          protection.coverage is unknown and I explicitly choose to skip it.
          Form a proposed financial_profile record now. Validate it, but do not
          confirm or save anything.
        supplied_keys:
          - liquidity.cash
          - assets.long_term
        expected_known_keys:
          - jurisdiction.tax_residency
          - income.annual_net
          - spending.annual_total
          - income.net_range_3y
          - liabilities.status
          - spending.monthly_necessary
          - liquidity.cash
          - assets.long_term
        required_unknown_keys: [protection.coverage]
        final_turn: true

  - id: goals-optional-and-conflict-three-turn
    workflow: goal_clarification
    skill: financial-goal-clarification
    proposal_schema: financial-goals-proposal.schema.json
    validator_tool: validate_financial_goals
    turns:
      - turn_id: goals-1
        user_message: >-
          Start goal clarification. Add goal_id home_option: an optional primary
          home opportunity, goal_category major_purchase, goal_subtype
          primary_home, outcome_type option_preservation, priority_rank 2,
          amount unknown, trigger-based timing when an attractive verified offer
          appears, and high flexibility. It must not receive continuous funding
          merely because it exists.
        supplied_keys:
          - home_option.commitment
          - home_option.goal_category
          - home_option.goal_subtype
          - home_option.outcome_type
          - home_option.priority_rank
          - home_option.amount
          - home_option.timing
          - home_option.flexibility
        expected_known_keys:
          - home_option.commitment
          - home_option.goal_category
          - home_option.goal_subtype
          - home_option.outcome_type
          - home_option.priority_rank
          - home_option.amount
          - home_option.timing
          - home_option.flexibility
        expected_goal_commitments:
          home_option: optional
        final_turn: false
      - turn_id: goals-2
        user_message: >-
          Continue the same goal conversation. Add goal_id retirement_base:
          retirement income readiness, goal_category retirement_and_independence,
          goal_subtype retirement_income_readiness, outcome_type
          recurring_expense_coverage, priority_rank 1, committed, amount
          to_be_calculated in CNY, target year 2045, and timing may be reviewed.
        supplied_keys:
          - retirement_base.commitment
          - retirement_base.goal_category
          - retirement_base.goal_subtype
          - retirement_base.outcome_type
          - retirement_base.priority_rank
          - retirement_base.amount
          - retirement_base.timing
          - retirement_base.flexibility
        expected_known_keys:
          - home_option.commitment
          - home_option.goal_category
          - home_option.goal_subtype
          - home_option.outcome_type
          - home_option.priority_rank
          - home_option.amount
          - home_option.timing
          - home_option.flexibility
          - retirement_base.commitment
          - retirement_base.goal_category
          - retirement_base.goal_subtype
          - retirement_base.outcome_type
          - retirement_base.priority_rank
          - retirement_base.amount
          - retirement_base.timing
          - retirement_base.flexibility
        expected_goal_commitments:
          home_option: optional
          retirement_base: committed
        final_turn: false
      - turn_id: goals-3
        user_message: >-
          Continue the same goal conversation. The two goals may depend on the
          same future surplus, so record conflict_id shared_goal_funding as a
          shared_funding conflict. Retirement has priority if the funding is
          insufficient, but home_option must remain optional and highly flexible.
          Form a proposed financial_goals v0.2 record now. Validate it, but do not
          confirm or save anything.
        supplied_keys:
          - shared_goal_funding.type
          - shared_goal_funding.priority_rule
        expected_known_keys:
          - home_option.commitment
          - home_option.goal_category
          - home_option.goal_subtype
          - home_option.outcome_type
          - home_option.priority_rank
          - home_option.amount
          - home_option.timing
          - home_option.flexibility
          - retirement_base.commitment
          - retirement_base.goal_category
          - retirement_base.goal_subtype
          - retirement_base.outcome_type
          - retirement_base.priority_rank
          - retirement_base.amount
          - retirement_base.timing
          - retirement_base.flexibility
          - shared_goal_funding.type
          - shared_goal_funding.priority_rule
        expected_goal_commitments:
          home_option: optional
          retirement_base: committed
        required_conflict_ids: [shared_goal_funding]
        final_turn: true

common_expectations:
  maximum_questions: 3
  forbidden_mcp_tools:
    - initialize_financial_planning_workspace
    - persist_confirmed_financial_state
  safety:
    confirms_state: false
    persists_state: false
    authorizes_transactions: false
    product_or_transaction_action: false
