id: china-cash-management-wealth-rules
title: Notice on Regulating Cash Management Wealth Management Products
publisher: China Banking and Insurance Regulatory Commission and People's Bank of China
jurisdiction: China mainland
source_url: https://jrj.sh.gov.cn/YWTBZCCX166/20210615/60dd0d2e531848f1911b1314d8a2d4f4.html
published_at: "2021-05-27"
retrieved_at: "2026-08-07"
usable_claims:
  - A cash-management wealth product invests only in money-market instruments and permits subscription and redemption on every trading day; products using terms such as money, cash, or liquidity in their names are treated as cash-management products under the notice.
  - Same-day received redemption for one investor, one sales channel, and one product must be capped at no more than CNY 10,000 per natural day.
  - Under specified stress conditions, the product may charge a mandatory redemption fee, defer part of a large redemption, delay payment, or suspend redemptions and liquidate after valuation deviation controls are breached.
  - Sellers must disclose risks and may not advertise or promise principal protection or guaranteed returns.
prompt_rules:
  - Do not equate a cash-management wealth product with a bank deposit, insured principal, or unlimited same-day cash.
  - Separate contractual trading-day redemption from same-day received redemption and from any channel-funded acceleration service.
  - Verify the exact product classification and sales document; a marketing label alone does not establish how a particular holding settles.
limitations:
  - The notice governs cash-management wealth products, not every daily-open, short-holding, or cash-like bank wealth product.
  - Product contracts and current channel rules can impose additional cutoffs, limits, holidays, minimum holdings, or operational constraints.
