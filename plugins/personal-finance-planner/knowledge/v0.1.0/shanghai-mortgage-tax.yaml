id: shanghai-mortgage-tax
title: 住房贷款利息专项附加扣除热点问答
source_type: official_tax_faq
publisher: 国家税务总局上海市税务局
source_url: https://shanghai.chinatax.gov.cn/zcfw/rdwd/202602/t479564.html
retrieved_at: "2026-08-05"
published_at: "2026-02-28"
usable_claims:
  - Under the stated current rules, eligible first-home loan interest may be deducted from taxable income at CNY 1,000 per month for up to 240 months.
planning_use:
  - Treat the rule as a possible taxable-income deduction when comparing a mortgage scenario, not as a CNY 1,000 monthly cash rebate.
limitations:
  - Eligibility, allocation between spouses, marginal tax rate, loan status, and rules at the purchase date determine actual benefit.
  - Reverify the rule immediately before a home-purchase decision.
