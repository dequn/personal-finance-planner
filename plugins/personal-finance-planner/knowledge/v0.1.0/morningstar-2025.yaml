usable_claims:
  - The report's base case identified a 3.9 percent highest starting safe withdrawal rate for a 30-year horizon at a 90 percent success probability.
  - For a 40-year horizon, its corresponding highest starting rate was 3.3 percent.
planning_use:
  - Use 3.3 percent as a research-anchored long-horizon scenario, then add a lower sensitivity such as 3.0 percent when the intended horizon exceeds 40 years.
limitations:
  - These are model outputs under Morningstar assumptions, not guarantees or personalized recommendations.
  - Market, tax, fee, currency, and spending assumptions may differ for a China-based investor.
  - A horizon longer than 40 years requires additional conservatism or explicit simulation.
