usable_claims:
  - The first-home provident-fund loan rate for terms longer than five years was reduced to 2.6% from 2025-05-08.
planning_use:
  - Use 2.6% only in a separate provident-fund scenario after confirming the user's eligibility and usable loan amount.
limitations:
  - This rate may change after the data date.
  - The rate does not prove that a user qualifies or can borrow the local maximum.
