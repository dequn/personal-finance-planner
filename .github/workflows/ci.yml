name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Run Plugin smoke tests
        run: >-
          uv run --project plugins/personal-finance-planner/mcp
          python -m unittest discover -s tests
      - name: Verify release manifest
        run: sha256sum -c release/manifest.sha256

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
